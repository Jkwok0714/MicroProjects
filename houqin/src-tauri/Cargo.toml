[package]
name = "houqin"
version = "0.1.0"
description = "Desktop directory-chain migrator"
authors = ["OpenAI Codex"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.65"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = ["dialog-open"] }

[dev-dependencies]
tempfile = "3.12"

[features]
custom-protocol = ["tauri/custom-protocol"]

